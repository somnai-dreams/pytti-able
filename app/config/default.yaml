# pytti-able defaults — overrides on top of the pytti-core schema
# (all settings/types/defaults: pytti-core src/pytti/config/structured_config.py).
# This file is also the source of the UI's initial field values.
#
# These defaults are tuned for Apple Silicon (MPS): 256px, one CLIP model,
# 2D animation, ~30 frames. Scale width/cutouts/models/steps up from here —
# every extra CLIP model and cutout costs render time roughly linearly.

defaults:
  - config_schema
  - _self_
  - conf: _empty

hydra:
  job:
    # run inside outputs/<date>/<time>/ so each run's images_out is isolated
    chdir: true

config_version: 2

#############
## Prompts ##
#############

scenes: 'infinite fractal mushroom forest | bioluminescent mycelium network | Mandelbrot mushroom caps:2 | sacred geometry:1.5 | psilocybin:1.5'
scene_prefix: ''
scene_suffix: '| signature:-1.0:-.95 | signatures:-1.0:-.95 | text:-1.0:-.95'

##################################

image_model: Limited Palette
vqgan_model: coco
animation_mode: '2D'   # 3D needs the depth model — parked on Mac for now

width: 256
height: 256

steps_per_scene: 300
steps_per_frame: 10    # -> 30 frames per scene
interpolation_steps: 50

seed: null  # null = fresh random seed each run
cutouts: 24
cut_pow: 2.1

border_mode: wrap

##########
# Camera #
##########

field_of_view: 60
near_plane: 2000
far_plane: 12500

# gentle 2D drift; expressions with t are supported, e.g. '10*sin(t/4)'
translate_x: '3'
zoom_x_2d: '1'
zoom_y_2d: '1'

infill_mode: wrap

##################################

pixel_size: 1
smoothing_weight: 1

#######################
### Limited Palette ###
#######################

palette_size: 50
palettes: 18
gamma: 1.5
hdr_weight: 0.35
palette_normalization_weight: 0.75

##################################

frames_per_second: 12
direct_stabilization_weight: '1'

############
### CLIP ###
############

# ViT-B/32 only: each additional model roughly doubles step time on MPS.
# All models (including the RN* ResNets) work — tick more for quality.
ViTB32: true
ViTB16: false
RN50x4: false

###############
### Outputs ###
###############

allow_overwrite: true
save_every: 0  # 0 = one frame per animation frame (auto-syncs to steps_per_frame)
backups: 3

##########################
### Performance tuning ###
##########################

gradient_accumulation_steps: 1
device: null  # null = auto (cuda > mps > cpu); or e.g. cuda:1, mps, cpu
