# pytti-able defaults — overrides on top of the pytti-core schema
# (all settings/types/defaults: pytti-core src/pytti/config/structured_config.py).
# This file is also the source of the UI's initial field values.
#
# Tuned for Apple Silicon: ~0.4s/step at these settings (MLX perceptor
# backend), so a default run is a few minutes for a 30-frame 512px
# animation. Every extra CLIP model and cutout costs render time roughly
# linearly.

defaults:
  - config_schema
  - _self_
  - conf: _empty

hydra:
  job:
    # run inside outputs/<date>/<time>/ so each run's images_out is isolated
    chdir: true

config_version: 2

#############
## Prompts ##
#############

scenes: 'infinite fractal mushroom forest | bioluminescent mycelium network | Mandelbrot mushroom caps:2 | sacred geometry:1.5 | psilocybin:1.5'
scene_prefix: ''
scene_suffix: '| signature:-1.0:-.95 | signatures:-1.0:-.95 | text:-1.0:-.95'

##################################

image_model: Limited Palette
vqgan_model: coco
# off: the default mlx_full backend is stills-only and refuses animation
# configs. To animate: set perceptor_backend torch + pick 2D (3D needs the
# depth model — parked on Mac for now).
animation_mode: 'off'

width: 512
height: 512

steps_per_scene: 600
steps_per_frame: 20    # -> 30 frames per scene
interpolation_steps: 50

seed: null  # null = fresh random seed each run
# 40 for the modern default ensemble — held-out adherence is monotonic
# in cut count with FARE+SigLIP2 (16: 0.284 / 40: 0.314) and 40 is the
# judged config. Drop to 16 for faster drafts at some composition cost.
cutouts: 40
cut_pow: 2.1
# Opt-in: won its single-prompt A/B but WASHED on the 10-prompt battery
# (2026-08-05, both judges ~0.40-0.45 win-rate vs off) - no earned
# authority as a default. Harmless to enable per-render.
coherence_weighting: false

# clamp = crops stay inside the canvas (the judged-reference setting).
# wrap is the 2021 tileable-texture mode: edge-crossing cutouts sample
# the OPPOSITE edge, training the image to tile - it actively destroys
# scene structure (sky gets gradient to continue into ground).
border_mode: clamp

##########
# Camera #
##########

field_of_view: 60
near_plane: 2000
far_plane: 12500

# gentle 2D drift; expressions with t are supported, e.g. '10*sin(t/4)'
translate_x: '3'
zoom_x_2d: '1'
zoom_y_2d: '1'

infill_mode: wrap

##################################

pixel_size: 1
# Engine schema default. The old STUDIO value (1 = 50x) was never
# battery-tested and TV-smooths composition flat — the documented
# contamination set (spec §5.6) shipped it to every render for weeks.
smoothing_weight: 0.02

#######################
### Limited Palette ###
#######################

palette_size: 50
palettes: 18
gamma: 1.5
# Engine schema defaults — the old 0.35/0.75 were untested 2021 carryovers.
hdr_weight: 0.01
palette_normalization_weight: 0.2

##################################

frames_per_second: 12
direct_stabilization_weight: ''

############
### CLIP ###
############

# Each additional model costs step time roughly by its size. The default
# The modern pair: FARE-4 B/32 (robust, perceptually-aligned gradients)
# + SigLIP2 B/16 (2025-grade prompt comprehension) — judged better prompt
# interpretation than the classic pair at matched cost, and both run on
# the MLX backends at classic-pair speed. Classic ViTs remain one click
# away for the 2021 look. Still torch-only: RN* ResNets, FARE2-L/14,
# SigLIP2-SO400M.
ViTB32: false
ViTB16: false
FARE4ViTB32: true
SigLIP2B16: true
RN50x4: false

###############
### Outputs ###
###############

allow_overwrite: true
save_every: 0  # 0 = one frame per animation frame (auto-syncs to steps_per_frame)
backups: 3

##########################
### Performance tuning ###
##########################

gradient_accumulation_steps: 1
device: null  # null = auto (cuda > mps > cpu); or e.g. cuda:1, mps, cpu
# mlx_full: the ENTIRE still-image step on Apple Metal as one compiled
# graph — A/B judged at parity quality, 2.1x torch at these settings
# (2.9x at draft sizes). Stills only: switch to mlx for animation/VQGAN
# (the error names this), torch for image prompts / semantic masks /
# non-ViT towers.
perceptor_backend: mlx_full
