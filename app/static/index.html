<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PYTTI STUDIO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="create.css">
</head>
<body>
  <a id="advanced-link" href="/bench.html" target="_blank" rel="noopener">ADVANCED ↗</a>
  <div id="sse-dot" style="display:none">◌ sse</div>

  <div id="bar-wrap">
    <div id="bar">
      <span id="bar-glyph">⌕</span>
      <input id="prompt" type="text" placeholder="describe a scene…" autocomplete="off" spellcheck="false">
      <div id="chip" style="display:none">
        <img id="chip-thumb" alt="" draggable="false">
        <span id="chip-name" style="display:none"></span>
        <button id="chip-mask">MASK</button>
        <button id="chip-x" title="remove image">✕</button>
      </div>
      <button id="attach" title="attach init image">⊕</button>
      <button id="gear" title="settings">⚙</button>
      <button id="go" title="render (Enter)">▶</button>
      <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" style="display:none">
    </div>
    <div id="popover" style="display:none">
      <div class="pop-row">
        <span class="pop-label">ASPECT</span>
        <button class="chip" data-aspect="1:1">1:1</button>
        <button class="chip" data-aspect="3:4">3:4</button>
        <button class="chip" data-aspect="4:3">4:3</button>
        <button class="chip" data-aspect="16:9">16:9</button>
        <button class="chip" data-aspect="auto" disabled>AUTO</button>
        <button class="chip custom" data-aspect="custom">CUSTOM</button>
      </div>
      <div class="pop-row">
        <span class="pop-label">SIZE</span>
        <button class="chip" data-size="draft">DRAFT</button>
        <button class="chip" data-size="full">FULL</button>
        <button class="chip custom" data-size="custom">CUSTOM</button>
      </div>
      <div class="pop-row">
        <span class="pop-label">STEPS</span>
        <button class="chip" data-steps="150">150</button>
        <button class="chip" data-steps="200">200</button>
        <button class="chip" data-steps="300">300</button>
        <button class="chip" data-steps="600">600</button>
        <button class="chip" data-steps="1200">1200</button>
        <button class="chip" data-steps="2400">2400</button>
        <input id="steps-custom" type="text" inputmode="numeric" maxlength="5" placeholder="custom" autocomplete="off" spellcheck="false">
      </div>
      <div class="pop-row">
        <span class="pop-label">LOOK</span>
        <button class="chip" data-look="limited">LIMITED</button>
        <button class="chip" data-look="unlimited">UNLIMITED</button>
        <button class="chip" data-look="vqgan">VQGAN</button>
        <button class="chip custom" data-look="custom">CUSTOM</button>
      </div>
      <div class="pop-row">
        <span class="pop-label">SEED</span>
        <button class="chip" data-seed="random">⚄ RANDOM</button>
        <button class="chip" data-seed="locked">🔒 LOCK</button>
      </div>
      <div class="pop-row" id="init-row" style="display:none">
        <span class="pop-label">INIT</span>
        <button class="chip" data-init-strength="subtle">SUBTLE</button>
        <button class="chip" data-init-strength="medium">MEDIUM</button>
        <button class="chip" data-init-strength="strong">STRONG</button>
        <button class="chip custom" data-init-strength="custom">CUSTOM</button>
        <button class="chip" data-hold title="hold meaning: image-embedding prompt (torch engine)">◈ HOLD</button>
      </div>
      <div class="pop-row" id="init-note" style="display:none">
        <span class="pop-label"></span>
        <span class="dim">torch engine</span>
      </div>
      <button id="exp-toggle" aria-expanded="false" title="opt-in engine modes — defaults change nothing"><span id="exp-chevron">▸</span> EXPERIMENTS</button>
      <div id="exp-body" style="display:none">
        <div class="pop-row">
          <span class="pop-label">INIT NOISE</span>
          <button class="chip" data-noise="white">WHITE</button>
          <button class="chip" data-noise="pink" title="pink noise + natural chroma — won the 2026-08-06 init-noise battery on both judges">PINK</button>
          <button class="chip" data-noise="gray">GRAY</button>
          <button class="chip custom" data-noise="custom">CUSTOM</button>
        </div>
        <div class="pop-row">
          <span class="pop-label" title="coarse-to-fine stages: compose as a thumbnail, refine up">PYRAMID</span>
          <button class="chip" data-pyramid="3">3</button>
          <button class="chip" data-pyramid="2">2</button>
          <button class="chip" data-pyramid="4">4</button>
          <button class="chip" data-pyramid="off">OFF</button>
          <button class="chip custom" data-pyramid="custom">CUSTOM</button>
        </div>
        <div class="pop-row">
          <span class="pop-label" title="weigh full-frame views over detail crops for the semantic loss">COHERENCE</span>
          <button class="chip" data-coherence="off">OFF</button>
          <button class="chip" data-coherence="on">ON</button>
          <button class="chip custom" data-coherence="custom">CUSTOM</button>
        </div>
        <div class="pop-row">
          <span class="pop-label" title="every cutout sees the whole frame">FULL VISION</span>
          <button class="chip" data-fullvision="off">OFF</button>
          <button class="chip" data-fullvision="on">ON</button>
          <button class="chip custom" data-fullvision="custom">CUSTOM</button>
        </div>
        <div class="pop-row">
          <span class="pop-label" title="structure early, detail late — fixed quality-phase schedules">PHASE SCHEDULE</span>
          <button class="chip" data-phase="off">OFF</button>
          <button class="chip" data-phase="on">ON</button>
          <button class="chip custom" data-phase="custom">CUSTOM</button>
        </div>
        <div class="pop-row">
          <span class="pop-label" title="end a scene early once the loss plateaus">AUTO-STOP</span>
          <button class="chip" data-autostop="off">OFF</button>
          <button class="chip" data-autostop="on" title="may stop early — detector is miscalibrated for the modern ensemble">ON</button>
          <button class="chip custom" data-autostop="custom">CUSTOM</button>
        </div>
      </div>
    </div>
  </div>

  <div id="gallery-scroll">
    <div id="gallery-canvas"></div>
  </div>

  <div id="empty-state" style="display:none">
    <div>type a prompt and press Enter</div>
    <div class="dim">( / focuses the bar · ⚙ sets size &amp; look )</div>
  </div>

  <div id="boot-skel">
    <div class="skel shimmer"></div><div class="skel shimmer"></div><div class="skel shimmer"></div><div class="skel shimmer"></div>
    <div class="skel shimmer"></div><div class="skel shimmer"></div><div class="skel shimmer"></div><div class="skel shimmer"></div>
  </div>

  <div id="boot-fail" style="display:none">
    <div>can't reach the studio server</div>
    <div id="boot-fail-msg" class="dim"></div>
    <button id="boot-retry">RETRY</button>
  </div>

  <div id="lightbox" style="display:none">
    <div id="lb-scrim"></div>
    <div id="lb-stage">
      <img id="lb-img-a" alt="" draggable="false">
      <img id="lb-img-b" alt="" draggable="false">
    </div>
    <div id="lb-jobs"></div>
    <div id="lb-frames"></div>
    <div id="lb-chrome">
      <div id="lb-prompt"></div>
      <div id="lb-params"></div>
      <div id="lb-actions">
        <button id="lb-rerun">⟳ RE-RUN</button>
        <button id="lb-tweak">✎ TWEAK</button>
        <button id="lb-advanced">⚙ ADVANCED</button>
        <button id="lb-download">↓ DOWNLOAD</button>
        <button id="lb-delete">✕ DELETE</button>
      </div>
    </div>
  </div>

  <div id="mask-editor" style="display:none">
    <div id="mask-scrim"></div>
    <div id="mask-head">paint where the image should hold — tinted = held</div>
    <div id="mask-stage">
      <img id="mask-img" alt="" draggable="false">
      <canvas id="mask-overlay"></canvas>
    </div>
    <div id="mask-toolbar">
      <button id="mask-paint" class="chip">PAINT</button>
      <button id="mask-erase" class="chip">ERASE</button>
      <button id="mask-invert" class="chip">INVERT</button>
      <button id="mask-clear" class="chip">CLEAR</button>
      <label id="mask-brush-wrap">brush <input id="mask-brush" type="range" min="8" max="160" step="1" value="48"></label>
      <button id="mask-remove" class="chip" style="display:none">REMOVE MASK</button>
      <button id="mask-save" class="chip">SAVE</button>
    </div>
  </div>

  <div id="confirm" style="display:none">
    <div id="confirm-card">
      <div id="confirm-text"></div>
      <div id="confirm-note" class="dim"></div>
      <div id="confirm-actions">
        <button id="confirm-yes">CONFIRM</button>
        <button id="confirm-no">CANCEL</button>
      </div>
    </div>
  </div>

  <div id="toast" style="display:none"></div>

  <script type="module" src="create.js"></script>
</body>
</html>
